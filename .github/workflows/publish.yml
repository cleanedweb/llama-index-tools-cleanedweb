# Publishes llama-index-tools-cleanedweb to PyPI with trusted publishing (no API token).
#
# Runs only when started by hand from the Actions tab, with "publish" typed in, and only while the
# repository variable PYPI_PUBLISH_ENABLED is "true".
#
# One-time setup on pypi.org (Account settings > Publishing > Add a new pending publisher):
#   PyPI project name: llama-index-tools-cleanedweb
#   Owner: cleanedweb    Repository name: llama-index-tools-cleanedweb
#   Workflow name: publish.yml    Environment name: pypi
#
# Bump the version and its CHANGELOG entry on main before starting a run: PyPI refuses to
# replace a version it already has.

name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to publish to PyPI'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Test and build
    if: ${{ vars.PYPI_PUBLISH_ENABLED == 'true' && inputs.confirm == 'publish' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Test
        run: |
          python -m pip install -e ".[dev]"
          pytest -q
      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/llama-index-tools-cleanedweb/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
